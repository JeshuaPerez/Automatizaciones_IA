
# =========================================================
# docker-compose.yml
# =========================================================
# Arquitectura:
# - PostgreSQL
# - n8n
# - ngrok
#
# Solución aplicada:
# Se eliminó la exposición del puerto 5432 para evitar
# conflictos con PostgreSQL instalado localmente
# u otros contenedores.
#
# PostgreSQL seguirá funcionando correctamente porque
# Docker permite comunicación interna entre servicios
# usando la red "automation_network".
# =========================================================

version: '3.9'

services:

  # =====================================================
  # SERVICIO: PostgreSQL
  # =====================================================

  postgres:
    image: postgres:16
    container_name: postgres_db

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    # ===================================================
    # IMPORTANTE:
    # Se eliminó:
    #
    # ports:
    #   - "5432:5432"
    #
    # Porque el puerto 5432 ya estaba ocupado
    # en la máquina host.
    #
    # n8n puede conectarse internamente usando:
    # host: postgres
    # puerto: 5432
    # ===================================================

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - automation_network



  # =====================================================
  # SERVICIO: n8n
  # =====================================================

  n8n:
    image: n8nio/n8n
    container_name: n8n

    restart: unless-stopped

    ports:
      - "5678:5678"

    environment:

      # =================================================
      # CONFIGURACIÓN GENERAL
      # =================================================
      TZ: ${TIMEZONE}

      # =================================================
      # AUTENTICACIÓN BÁSICA
      # =================================================
      N8N_BASIC_AUTH_ACTIVE: true
      N8N_BASIC_AUTH_USER: ${N8N_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD}

      # =================================================
      # CONFIGURACIÓN HOST / WEBHOOKS
      # =================================================
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: 5678
      N8N_PROTOCOL: https

      WEBHOOK_URL: ${WEBHOOK_URL}

      # =================================================
      # BASE DE DATOS PostgreSQL
      # =================================================
      DB_TYPE: postgresdb

      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432

      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}

      # =================================================
      # OPENROUTER
      # =================================================
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}

    depends_on:
      - postgres

    volumes:
      - n8n_data:/home/node/.n8n

    networks:
      - automation_network



  # =====================================================
  # SERVICIO: ngrok
  # =====================================================

  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok

    restart: unless-stopped

    command:
      - "http"
      - "n8n:5678"

    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}

    ports:
      - "4040:4040"

    depends_on:
      - n8n

    networks:
      - automation_network



# =========================================================
# VOLÚMENES
# =========================================================

volumes:

  postgres_data:
  n8n_data:



# =========================================================
# RED PRIVADA
# =========================================================

networks:

  automation_network:
    driver: bridge
