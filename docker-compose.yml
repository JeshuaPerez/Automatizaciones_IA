# =========================================================
# docker-compose.yml
# =========================================================
# Este archivo define una arquitectura básica utilizando:
#
# 1. n8n         -> Plataforma de automatización de flujos
# 2. PostgreSQL  -> Base de datos para almacenar información
# 3. ngrok       -> Exponer servicios locales a internet
# 4. OpenRouter  -> API externa utilizada por n8n mediante variables .env
#
# Todos los valores sensibles se almacenan en un archivo .env
# para mantener seguridad y flexibilidad.
#
# Estructura recomendada:
#
# proyecto/
# ├── docker-compose.yml
# ├── .env
# └── data/
#
# =========================================================

version: '3.9'

services:

  # =====================================================
  # SERVICIO: PostgreSQL
  # =====================================================
  # Base de datos principal para n8n.
  #
  # PostgreSQL almacena:
  # - workflows
  # - credenciales
  # - ejecuciones
  # - configuraciones
  #
  # Los datos persistirán gracias al volumen "postgres_data".
  # =====================================================

  postgres:
    image: postgres:16
    container_name: postgres_db

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - automation_network



  # =====================================================
  # SERVICIO: n8n
  # =====================================================
  # n8n es una plataforma de automatización tipo:
  # - Zapier
  # - Make
  # - Power Automate
  #
  # Aquí se conecta a PostgreSQL para guardar
  # toda la información importante.
  #
  # También utilizamos variables para:
  # - autenticación
  # - URL pública
  # - zona horaria
  # =====================================================

  n8n:
    image: n8nio/n8n
    container_name: n8n

    restart: unless-stopped

    ports:
      - "5678:5678"

    environment:

      # =================================================
      # CONFIGURACIÓN GENERAL
      # =================================================
      TZ: ${TIMEZONE}

      # =================================================
      # AUTENTICACIÓN BÁSICA
      # =================================================
      # Protege el panel de n8n con usuario y contraseña
      # =================================================
      N8N_BASIC_AUTH_ACTIVE: true
      N8N_BASIC_AUTH_USER: ${N8N_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD}

      # =================================================
      # CONFIGURACIÓN DE HOST
      # =================================================
      # ngrok generará una URL pública que será usada
      # por n8n para webhooks y accesos externos.
      # =================================================
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: 5678
      N8N_PROTOCOL: https

      WEBHOOK_URL: ${WEBHOOK_URL}

      # =================================================
      # BASE DE DATOS PostgreSQL
      # =================================================
      DB_TYPE: postgresdb

      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432

      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}

      # =================================================
      # OPENROUTER API
      # =================================================
      # Esta variable podrá utilizarse dentro
      # de workflows o nodos HTTP Request.
      # =================================================
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}

    depends_on:
      - postgres

    volumes:
      - n8n_data:/home/node/.n8n

    networks:
      - automation_network



  # =====================================================
  # SERVICIO: ngrok
  # =====================================================
  # ngrok expone n8n a internet.
  #
  # Ejemplo:
  # https://random-url.ngrok-free.app
  #
  # Esto es útil para:
  # - Webhooks
  # - APIs externas
  # - pruebas remotas
  #
  # IMPORTANTE:
  # Debes crear una cuenta en:
  # https://ngrok.com/
  #
  # Y obtener:
  # - NGROK_AUTHTOKEN
  # =====================================================

  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok

    restart: unless-stopped

    command:
      - "http"
      - "n8n:5678"

    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}

    ports:
      - "4040:4040"

    depends_on:
      - n8n

    networks:
      - automation_network



# =========================================================
# VOLÚMENES
# =========================================================
# Permiten persistencia de datos aunque los contenedores
# sean eliminados o reiniciados.
# =========================================================

volumes:

  postgres_data:
  n8n_data:



# =========================================================
# RED PRIVADA
# =========================================================
# Todos los servicios se comunican internamente
# utilizando esta red docker.
# =========================================================

networks:

  automation_network:
    driver: bridge



# =========================================================
# =============DESPLEGAR CONTENEDORES=================
# Para iniciar la arquitectura, ejecuta:docker compose up -d